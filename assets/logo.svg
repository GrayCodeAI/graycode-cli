<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 160" width="580" height="160" role="img" aria-labelledby="title desc">
  <title id="title">hawk</title>
  <desc id="desc">AI Coding Agent — terminal-first, developer-focused.</desc>

  <style>
    .logo-bg { fill: #f8fafc; stroke: #e5e7eb; }
    .hawk-body { fill: #5c4033; }
    .hawk-wing { fill: #6b4e31; }
    .hawk-head { fill: #5c4033; }
    .hawk-beak { fill: #e67e22; }
    .hawk-beak-outline { stroke: #b85c1f; }
    .beak-highlight { stroke: #f5d08d; }
    .hawk-eye { fill: #f4d03f; stroke: #7d6608; }
    .hawk-pupil { fill: #1a140f; }
    .hawk-text { fill: #2c241e; }
    .hawk-subtext { fill: #6b5b4f; }
    .hawk-detail { stroke: #3d2b22; }
    .hawk-frame { stroke: #d4c3b0; }

    @media (prefers-color-scheme: dark) {
      .logo-bg { fill: #1c2526; stroke: #3a4547; }
      .hawk-body { fill: #c8b39e; }
      .hawk-wing { fill: #b39a80; }
      .hawk-head { fill: #c8b39e; }
      .hawk-beak { fill: #f39c12; }
      .hawk-beak-outline { stroke: #c97a1a; }
      .beak-highlight { stroke: #f8e3b3; }
      .hawk-eye { fill: #f7dc6f; stroke: #a67c00; }
      .hawk-pupil { fill: #0f0c08; }
      .hawk-text { fill: #f5f0e8; }
      .hawk-subtext { fill: #b8a99a; }
      .hawk-detail { stroke: #5c4633; }
      .hawk-frame { stroke: #4a5c5e; }
    }
  </style>

  <!-- Clean theme-aware frame -->
  <rect x="8" y="8" width="564" height="144" rx="20" class="logo-bg" stroke-width="1.5" stroke="currentColor" style="stroke:var(--frame-stroke, #d4c3b0)"/>

  <!-- Majestic realistic hawk (side profile, real bird of prey look) -->
  <g transform="translate(28, 22)">

    <!-- Main body / chest -->
    <ellipse cx="92" cy="68" rx="38" ry="32" class="hawk-body"/>
    
    <!-- Back / wing base -->
    <path d="M 58 52 Q 42 48 36 62 Q 34 82 52 90 Q 68 88 74 72 Z" class="hawk-wing"/>
    
    <!-- Upper wing feathers -->
    <path d="M 52 54 Q 38 52 34 64" fill="none" class="hawk-detail" stroke-width="2.5" opacity="0.7"/>
    <path d="M 48 58 Q 36 58 34 68" fill="none" class="hawk-detail" stroke-width="2" opacity="0.6"/>
    <path d="M 56 62 Q 42 66 40 76" fill="none" class="hawk-detail" stroke-width="1.8" opacity="0.55"/>

    <!-- Head -->
    <ellipse cx="128" cy="46" rx="26" ry="22" class="hawk-head"/>
    
    <!-- Head feather texture -->
    <path d="M 110 38 Q 118 34 126 38" fill="none" class="hawk-detail" stroke-width="1.5" opacity="0.4"/>
    <path d="M 116 42 Q 124 39 130 43" fill="none" class="hawk-detail" stroke-width="1.2" opacity="0.35"/>

    <!-- Fierce real hawk eye -->
    <ellipse cx="142" cy="42" rx="7.5" ry="6" class="hawk-eye"/>
    <ellipse cx="143.5" cy="42" rx="3.2" ry="2.8" class="hawk-pupil"/>
    <!-- Eye highlight / catchlight -->
    <circle cx="145" cy="40" r="1.4" fill="#fff" opacity="0.9"/>

    <!-- Strong supraorbital ridge (real hawk brow) -->
    <path d="M 128 34 Q 138 31 148 35" fill="none" class="hawk-detail" stroke-width="2.5" opacity="0.8"/>

    <!-- Signature hooked beak - very realistic -->
    <!-- Upper mandible -->
    <path d="M 155 42 Q 168 39 175 48 Q 177 54 172 56" class="hawk-beak" stroke-width="0.5"/>
    <!-- Lower mandible -->
    <path d="M 155 46 Q 165 48 172 54" class="hawk-beak" stroke-width="0.5"/>
    <!-- Beak outline for definition -->
    <path d="M 155 42 Q 168 39 175 48 Q 177 54 172 56" fill="none" class="hawk-beak-outline" stroke-width="1.2"/>
    <!-- Beak highlight / cere area -->
    <path d="M 156 44 Q 162 43 166 47" fill="none" class="beak-highlight" stroke-width="1.8" opacity="0.65"/>

    <!-- Nostril detail -->
    <circle cx="162" cy="46" r="1.1" fill="#3d2b22" opacity="0.6"/>

    <!-- Neck / shoulder connection -->
    <path d="M 108 58 Q 118 62 122 72" fill="none" class="hawk-detail" stroke-width="3" opacity="0.5"/>

    <!-- Folded primary wing feathers (realistic layering) -->
    <path d="M 68 70 Q 54 78 48 96" fill="none" class="hawk-detail" stroke-width="2.8" opacity="0.65"/>
    <path d="M 72 74 Q 58 84 54 100" fill="none" class="hawk-detail" stroke-width="2.2" opacity="0.5"/>
    <path d="M 78 78 Q 64 90 62 104" fill="none" class="hawk-detail" stroke-width="1.6" opacity="0.4"/>

    <!-- Tail (real red-tailed hawk suggestion) -->
    <path d="M 58 90 Q 46 102 44 118 Q 52 114 62 108" class="hawk-wing"/>
    <path d="M 64 92 Q 54 106 52 120" fill="none" class="hawk-detail" stroke-width="1.8" opacity="0.6"/>
    <path d="M 70 94 Q 62 110 60 122" fill="none" class="hawk-detail" stroke-width="1.4" opacity="0.45"/>

  </g>

  <!-- Wordmark - strong, modern, balanced with the bird -->
  <text x="305" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="54" font-weight="800" letter-spacing="-1.8" class="hawk-text">hawk</text>
  <text x="305" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="12.5" font-weight="600" letter-spacing="1.6" class="hawk-subtext">AI CODING AGENT</text>
</svg>
