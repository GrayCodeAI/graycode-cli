  </g>
  <!-- Text -->
  <text x="140" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="700" fill="url(#grad)">hawk</text>
  <text x="140" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#718096">AI Coding Agent</text>
