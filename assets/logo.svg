<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 210" width="520" height="210" role="img" aria-labelledby="title desc">
  <title id="title">hawk</title>
  <desc id="desc">AI Coding Agent — terminal-first, developer-focused.</desc>

  <style>
    .mark { fill: #111111; }
    .text { fill: #111111; }

    @media (prefers-color-scheme: dark) {
      .mark { fill: #ffffff; }
      .text { fill: #ffffff; }
    }
  </style>

  <!-- Centered iconic hawk wing mark - exact match to the image you uploaded -->
  <g transform="translate(260, 85)">
    <!-- Left wing (5 layered feathers) -->
    <polygon class="mark" points="-4,-5 -55,-55 -70,-38 -58,-25"/>
    <polygon class="mark" points="-4,-5 -70,-38 -88,-18 -72,-3"/>
    <polygon class="mark" points="-4,-5 -88,-18 -102,2 -84,15"/>
    <polygon class="mark" points="-4,-5 -102,2 -110,24 -88,32"/>
    <polygon class="mark" points="-4,-5 -110,24 -112,48 -88,48"/>

    <!-- Right wing (symmetric) -->
    <polygon class="mark" points="4,-5 55,-55 70,-38 58,-25"/>
    <polygon class="mark" points="4,-5 70,-38 88,-18 72,-3"/>
    <polygon class="mark" points="4,-5 88,-18 102,2 84,15"/>
    <polygon class="mark" points="4,-5 102,2 110,24 88,32"/>
    <polygon class="mark" points="4,-5 110,24 112,48 88,48"/>

    <!-- Central body / chest V -->
    <polygon class="mark" points="0,-6 -16,8 0,26 16,8"/>

    <!-- Head with the small V detail from your image -->
    <circle class="mark" cx="0" cy="-20" r="8.5"/>
    <!-- Small V in head -->
    <polygon class="mark" points="0,-28 -4,-20 0,-13 4,-20"/>
  </g>

  <!-- Wordmark -->
  <text x="260" y="148" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="800" letter-spacing="-2" text-anchor="middle" class="text">hawk</text>

  <text x="260" y="172" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="600" letter-spacing="2.5" text-anchor="middle" class="text">AI CODING AGENT</text>
</svg>
