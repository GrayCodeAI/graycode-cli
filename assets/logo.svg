<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 154" width="580" height="154" role="img" aria-labelledby="title desc">
  <title id="title">hawk</title>
  <desc id="desc">AI Coding Agent — terminal-first, developer-focused.</desc>

  <style>
    .logo-bg { fill: #f8fafc; stroke: #e2e8f0; }
    .hawk-body, .hawk-head { fill: #1e2937; stroke: #0f172a; }
    .hawk-wing { fill: #334155; stroke: #0f172a; }
    .hawk-beak { fill: #f59e0b; }
    .hawk-beak-outline { stroke: #c2410f; }
    .beak-highlight { stroke: #fed7aa; }
    .hawk-text { fill: #1e2937; }
    .hawk-subtext { fill: #64748b; }
    .tail { fill: #475569; stroke: #0f172a; }
    .talon { fill: #f59e0b; stroke: #c2410f; }
    .detail-stroke { stroke: #475569; }

    @media (prefers-color-scheme: dark) {
      .logo-bg { fill: #0f172a; stroke: #334155; }
      .hawk-body, .hawk-head { fill: #e5e7eb; stroke: #1e2937; stroke-width: 1.5; }
      .hawk-wing { fill: #d1d5db; stroke: #1e2937; stroke-width: 1.5; }
      .hawk-beak { fill: #fb923c; }
      .hawk-beak-outline { stroke: #9f3410; }
      .beak-highlight { stroke: #fef3c7; }
      .hawk-text { fill: #f8fafc; }
      .hawk-subtext { fill: #94a3b8; }
      .tail { fill: #64748b; stroke: #334155; }
      .talon { fill: #fb923c; stroke: #c2410f; }
      .detail-stroke { stroke: #64748b; }
    }
  </style>

  <!-- Subtle theme-aware background frame for presence on both light and dark GitHub -->
  <rect x="6" y="6" width="568" height="142" rx="18" class="logo-bg" stroke-width="1.25"/>

  <!-- Hawk illustration (core expressive forms preserved + simplified for clarity at small sizes) -->
  <g transform="translate(14, 12) scale(0.95)">
    <!-- Left wing (back) -->
    <path d="M 75 45 C 65 35, 55 30, 45 32 C 35 34, 25 40, 20 50 C 15 60, 18 75, 30 85 C 40 92, 55 95, 70 90 C 80 85, 85 75, 85 65 C 85 55, 80 50, 75 45 Z" 
          class="hawk-wing" stroke-width="1.1" stroke-linejoin="round"/>

    <!-- Body / Torso -->
    <path d="M 75 45 C 70 40, 75 35, 85 32 C 95 28, 110 25, 125 28 C 140 30, 150 35, 155 42 C 160 50, 158 60, 150 68 C 142 76, 130 80, 115 78 C 100 76, 85 70, 80 62 C 75 55, 73 50, 75 45 Z" 
          class="hawk-body" stroke-width="1.1" stroke-linejoin="round"/>

    <!-- Head -->
    <path d="M 125 28 C 130 22, 138 18, 148 20 C 158 22, 165 28, 168 35 C 170 42, 168 50, 162 55 C 156 60, 148 62, 140 58 C 132 54, 128 48, 127 40 C 126 35, 125 30, 125 28 Z" 
          class="hawk-head" stroke-width="1.1" stroke-linejoin="round"/>

    <!-- Beak (hooked) -->
    <path d="M 168 35 C 175 33, 182 35, 188 40 C 192 44, 190 50, 185 52 C 180 54, 175 52, 172 48 C 170 44, 168 40, 168 35 Z" 
          class="hawk-beak hawk-beak-outline" stroke-width="0.9"/>
    <!-- Beak highlight -->
    <path d="M 170 38 Q 178 38 182 42" fill="none" class="beak-highlight" stroke-width="1.1" opacity="0.65"/>

    <!-- Eye (predatory, with catchlight) -->
    <ellipse cx="152" cy="38" rx="5" ry="4" fill="#fde047" stroke="#854d0e" stroke-width="0.8"/>
    <ellipse cx="153" cy="37" rx="2" ry="1.6" fill="#1e2937"/>
    <circle cx="153.6" cy="36.4" r="0.9" fill="#fff"/>

    <!-- Fierce brow ridge -->
    <path d="M 145 32 Q 152 28 160 32" fill="none" stroke-width="1.6" opacity="0.65" class="detail-stroke"/>

    <!-- Right wing (front, extended) -->
    <path d="M 110 35 C 120 25, 135 18, 150 20 C 165 22, 180 28, 195 38 C 210 48, 220 60, 225 75 C 228 85, 220 95, 210 100 C 200 105, 185 102, 175 95 C 165 88, 155 80, 145 72 C 135 64, 125 55, 118 48 C 112 42, 110 38, 110 35 Z" 
          class="hawk-wing" stroke-width="1.1" stroke-linejoin="round"/>

    <!-- Tail feathers -->
    <path d="M 70 90 C 65 95, 60 105, 58 115 C 62 110, 68 105, 75 100 C 80 96, 78 92, 75 90 Z" 
          class="tail" stroke-width="0.9"/>
    <path d="M 80 92 C 78 100, 75 110, 73 118 C 78 112, 84 106, 88 100 C 90 96, 86 93, 80 92 Z" 
          class="tail" stroke-width="0.9"/>

    <!-- Legs + Talons -->
    <path d="M 95 78 C 98 85, 100 92, 98 98 C 96 102, 92 103, 90 100 C 88 97, 90 92, 92 88 C 94 84, 95 80, 95 78 Z" class="talon" stroke-width="0.7"/>
    <path d="M 90 100 L 86 106" fill="none" class="talon" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M 92 102 L 89 108" fill="none" class="talon" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M 95 101 L 94 107" fill="none" class="talon" stroke-width="1.5" stroke-linecap="round"/>

    <path d="M 115 76 C 118 83, 120 90, 118 96 C 116 100, 112 101, 110 98 C 108 95, 110 90, 112 86 C 114 82, 115 78, 115 76 Z" class="talon" stroke-width="0.7"/>
    <path d="M 110 98 L 106 104" fill="none" class="talon" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M 112 100 L 109 107" fill="none" class="talon" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M 115 99 L 114 106" fill="none" class="talon" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="302" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="53" font-weight="800" letter-spacing="-1.7" class="hawk-text">hawk</text>
  <text x="302" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="12.5" font-weight="600" letter-spacing="1.7" class="hawk-subtext">AI CODING AGENT</text>
</svg>
