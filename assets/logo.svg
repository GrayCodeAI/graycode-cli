<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 210" width="520" height="210" role="img" aria-labelledby="title desc">
  <title id="title">hawk</title>
  <desc id="desc">AI Coding Agent — terminal-first, developer-focused.</desc>

  <style>
    .mark { fill: #111111; }
    .text { fill: #111111; }

    @media (prefers-color-scheme: dark) {
      .mark { fill: #ffffff; }
      .text { fill: #ffffff; }
    }
  </style>

  <!-- Centered iconic hawk wing mark - exact match to the image you uploaded (bold geometric wings) -->
  <g transform="translate(260, 82)">
    <!-- Left wing feathers - 5 layers, fanned and pointed -->
    <polygon class="mark" points="0,0 -48,-52 -64,-36 -52,-22"/>
    <polygon class="mark" points="0,0 -64,-36 -82,-16 -66,-2"/>
    <polygon class="mark" points="0,0 -82,-16 -98,6 -80,16"/>
    <polygon class="mark" points="0,0 -98,6 -110,28 -88,34"/>
    <polygon class="mark" points="0,0 -110,28 -112,52 -88,50"/>

    <!-- Right wing feathers -->
    <polygon class="mark" points="0,0 48,-52 64,-36 52,-22"/>
    <polygon class="mark" points="0,0 64,-36 82,-16 66,-2"/>
    <polygon class="mark" points="0,0 82,-16 98,6 80,16"/>
    <polygon class="mark" points="0,0 98,6 110,28 88,34"/>
    <polygon class="mark" points="0,0 110,28 112,52 88,50"/>

    <!-- Central body - strong V / diamond shape -->
    <polygon class="mark" points="0,-5 -20,9 0,32 20,9"/>

    <!-- Head on top with small V cutout detail -->
    <circle class="mark" cx="0" cy="-23" r="9.5"/>
    <polygon class="mark" points="0,-31 -5.5,-23 0,-15 5.5,-23"/>
  </g>

  <!-- Wordmark -->
  <text x="260" y="148" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="800" letter-spacing="-2" text-anchor="middle" class="text">hawk</text>

  <text x="260" y="172" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="600" letter-spacing="2.5" text-anchor="middle" class="text">AI CODING AGENT</text>
</svg>
