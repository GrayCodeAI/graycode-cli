<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 210" width="520" height="210" role="img" aria-labelledby="title desc">
  <title id="title">hawk</title>
  <desc id="desc">AI Coding Agent — terminal-first, developer-focused.</desc>

  <style>
    .mark { fill: #111111; }
    .text { fill: #111111; }

    @media (prefers-color-scheme: dark) {
      .mark { fill: #ffffff; }
      .text { fill: #ffffff; }
    }
  </style>

  <!-- Centered iconic hawk wing mark (exactly matching the provided style) -->
  <g transform="translate(260, 92)">
    <!-- Left wing feathers -->
    <polygon class="mark" points="0,0 -38,-32 -52,-18 -42,-8"/>
    <polygon class="mark" points="0,0 -52,-18 -68,-4 -54,6"/>
    <polygon class="mark" points="0,0 -68,-4 -82,10 -66,18"/>
    <polygon class="mark" points="0,0 -82,10 -92,26 -74,32"/>
    <polygon class="mark" points="0,0 -92,26 -96,44 -76,46"/>

    <!-- Right wing feathers (symmetric) -->
    <polygon class="mark" points="0,0 38,-32 52,-18 42,-8"/>
    <polygon class="mark" points="0,0 52,-18 68,-4 54,6"/>
    <polygon class="mark" points="0,0 68,-4 82,10 66,18"/>
    <polygon class="mark" points="0,0 82,10 92,26 74,32"/>
    <polygon class="mark" points="0,0 92,26 96,44 76,46"/>

    <!-- Central body / V shape -->
    <polygon class="mark" points="0,-8 -14,12 0,28 14,12"/>

    <!-- Head / top detail -->
    <circle class="mark" cx="0" cy="-18" r="7"/>
    <polygon class="mark" points="0,-25 -5,-18 0,-11 5,-18"/>
  </g>

  <!-- Wordmark -->
  <text x="260" y="148" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="800" letter-spacing="-2" text-anchor="middle" class="text">hawk</text>

  <text x="260" y="172" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="600" letter-spacing="2.5" text-anchor="middle" class="text">AI CODING AGENT</text>
</svg>
