# Canonical release workflow for GrayCodeAI Go binary repos.
# Triggered by release-please when it pushes a v* tag.
# Source of truth: .shared-templates/workflows/go-release.yml.tmpl

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write   # for cosign keyless signing if enabled later

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0   # goreleaser needs full history for changelog

      # Releases must use Gitlink pins only — never a branch head fallback.
      - uses: ./.github/actions/checkout-eyrie
        with:
          allow_branch_fallback: "false"

      - name: Verify Gitlink pins present
        run: |
          set -euo pipefail
          missing=0
          for repo in hawk-core-contracts eyrie inspect sight tok trace yaad; do
            commit=$(git ls-tree HEAD "external/${repo}" | awk '{print $3}' || true)
            if [ -z "$commit" ]; then
              echo "::error::Release requires Gitlink for external/${repo}"
              missing=1
            else
              head=$(git -C "external/${repo}" rev-parse HEAD)
              if [ "$head" != "$commit" ]; then
                echo "::error::external/${repo} checked out $head, Gitlink wants $commit"
                missing=1
              else
                echo "OK external/${repo} @ ${commit:0:12}"
              fi
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional secrets used by some repos' goreleaser configs:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
