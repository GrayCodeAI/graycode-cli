name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          clone_with_retry() {
            local repo=$1 dest=$2
            for i in 1 2 3; do
              git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/GrayCodeAI/${repo}.git" "$dest" && return 0
              echo "Retry $i for $repo..." && sleep $((i * 5))
            done
            echo "Failed to clone $repo after 3 attempts" && return 1
          }
          clone_with_retry eyrie ../eyrie
          clone_with_retry tok ../tok
          clone_with_retry yaad ../yaad
          clone_with_retry inspect ../inspect
          clone_with_retry sight ../sight

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Create workspace
        run: |
          cat > go.work << 'EOF'
          go 1.26.1
          use .
          replace (
            github.com/GrayCodeAI/eyrie => ../eyrie
            github.com/GrayCodeAI/tok => ../tok
            github.com/GrayCodeAI/yaad => ../yaad
            github.com/GrayCodeAI/inspect => ../inspect
            github.com/GrayCodeAI/sight => ../sight
          )
          EOF

      - name: Run tests
        run: go test -race -count=1 -timeout=120s ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          clone_with_retry() {
            local repo=$1 dest=$2
            for i in 1 2 3; do
              git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/GrayCodeAI/${repo}.git" "$dest" && return 0
              echo "Retry $i for $repo..." && sleep $((i * 5))
            done
            echo "Failed to clone $repo after 3 attempts" && return 1
          }
          clone_with_retry eyrie ../eyrie
          clone_with_retry tok ../tok
          clone_with_retry yaad ../yaad
          clone_with_retry inspect ../inspect
          clone_with_retry sight ../sight

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Create workspace
        run: |
          cat > go.work << 'EOF'
          go 1.26.1
          use .
          replace (
            github.com/GrayCodeAI/eyrie => ../eyrie
            github.com/GrayCodeAI/tok => ../tok
            github.com/GrayCodeAI/yaad => ../yaad
            github.com/GrayCodeAI/inspect => ../inspect
            github.com/GrayCodeAI/sight => ../sight
          )
          EOF

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.0
          install-mode: goinstall
          verify: false
          args: --timeout 5m

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          clone_with_retry() {
            local repo=$1 dest=$2
            for i in 1 2 3; do
              git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/GrayCodeAI/${repo}.git" "$dest" && return 0
              echo "Retry $i for $repo..." && sleep $((i * 5))
            done
            echo "Failed to clone $repo after 3 attempts" && return 1
          }
          clone_with_retry eyrie ../eyrie
          clone_with_retry tok ../tok
          clone_with_retry yaad ../yaad
          clone_with_retry inspect ../inspect
          clone_with_retry sight ../sight

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Create workspace
        run: |
          cat > go.work << 'EOF'
          go 1.26.1
          use .
          replace (
            github.com/GrayCodeAI/eyrie => ../eyrie
            github.com/GrayCodeAI/tok => ../tok
            github.com/GrayCodeAI/yaad => ../yaad
            github.com/GrayCodeAI/inspect => ../inspect
            github.com/GrayCodeAI/sight => ../sight
          )
          EOF

      - name: Run govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./... || true

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Checkout dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          clone_with_retry() {
            local repo=$1 dest=$2
            for i in 1 2 3; do
              git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/GrayCodeAI/${repo}.git" "$dest" && return 0
              echo "Retry $i for $repo..." && sleep $((i * 5))
            done
            echo "Failed to clone $repo after 3 attempts" && return 1
          }
          clone_with_retry eyrie ../eyrie
          clone_with_retry tok ../tok
          clone_with_retry yaad ../yaad
          clone_with_retry inspect ../inspect
          clone_with_retry sight ../sight

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Create workspace
        run: |
          cat > go.work << 'EOF'
          go 1.26.1
          use .
          replace (
            github.com/GrayCodeAI/eyrie => ../eyrie
            github.com/GrayCodeAI/tok => ../tok
            github.com/GrayCodeAI/yaad => ../yaad
            github.com/GrayCodeAI/inspect => ../inspect
            github.com/GrayCodeAI/sight => ../sight
          )
          EOF

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags "-s -w" -o hawk-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} .
