name: Bug report
description: Something is broken or behaving unexpectedly.
title: "bug: <one-line summary>"
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much
        of the form as you can — the more we know, the faster we can fix it.

        Before submitting:
        - Search [existing issues](https://github.com/GrayCodeAI/graycode-cli/issues) to avoid duplicates.
        - If this is a security issue, please **do not** file a public issue. See `SECURITY.md`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
      placeholder: When I run `graycode ...`, I expected X but got Y.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably reproduce the problem.
      placeholder: |
        1. Run `graycode ...`
        2. Type `...`
        3. See error `...`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: graycode-version
    attributes:
      label: graycode version
      description: Output of `graycode version` (or `graycode --version`).
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. macOS 14.5 (arm64), Ubuntu 24.04 (amd64), Windows 11 (amd64).
      placeholder: "macOS 14.5 (arm64)"
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version (if building from source)
      description: Output of `go version`. Skip if you installed a pre-built binary.
      placeholder: "go version go1.26.1 darwin/arm64"

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: |
        Paste any relevant output. If running interactively, re-run with `--verbose`
        and include the output. **Redact any secrets, tokens, or private data first.**
      render: shell

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I redacted any secrets, API keys, or private data from logs.
          required: true
