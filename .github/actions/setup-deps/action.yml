name: Setup Dependencies
description: Clone ecosystem sibling repos with retry, setup Go, sync workspace

inputs:
  go-version:
    description: Go version to install
    default: '1.26.1'
  token:
    description: GitHub token for authenticated clones
    required: true

runs:
  using: composite
  steps:
    - name: Checkout sibling dependencies
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        clone_with_retry() {
          local repo=$1 dest=$2 branch=${3:-main}
          for i in 1 2 3; do
            git clone --depth=1 --branch "$branch" "https://x-access-token:${GH_TOKEN}@github.com/GrayCodeAI/${repo}.git" "$dest" && return 0
            echo "Retry $i for $repo..." && sleep $((i * 5))
          done
          echo "Failed to clone $repo after 3 attempts" && return 1
        }
        ws_parent="$(cd "${GITHUB_WORKSPACE}/.." && pwd)"
        mkdir -p "$ws_parent"
        while IFS= read -r repo; do
          [ "$repo" = graycode-cli ] && continue
          clone_with_retry "$repo" "$ws_parent/$repo" main
        done < <(./scripts/ecosystem-manifest.sh list workspace)

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ inputs.go-version }}

    - name: Sync workspace
      shell: bash
      run: |
        make workspace
