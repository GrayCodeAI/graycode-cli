name: Checkout eyrie
description: Clone ecosystem repos into hawk/external for hawk go.work

inputs:
  ref:
    description: Git ref to checkout (branch or tag)
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Clone ecosystem repos
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${GITHUB_WORKSPACE}/external"
        for repo in eyrie inspect sight tok trace yaad; do
          dest="${GITHUB_WORKSPACE}/external/${repo}"
          if [ -d "$dest/.git" ]; then
            echo "$repo already present at $dest"
            continue
          fi
          ref="${{ inputs.ref }}"
          # Fall back to main if the branch doesn't exist on the dependency repo.
          if ! git ls-remote --heads "https://github.com/GrayCodeAI/${repo}.git" "$ref" | grep -q .; then
            echo "Branch '$ref' not found on $repo, falling back to main"
            ref="main"
          fi
          git clone --depth=1 --branch "$ref" \
            "https://github.com/GrayCodeAI/${repo}.git" "$dest"
        done
