name: Checkout eyrie
description: Clone eyrie as a sibling repo for hawk go.work (../eyrie)

inputs:
  ref:
    description: Git ref to checkout (branch or tag)
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Clone eyrie
      shell: bash
      run: |
        set -euo pipefail
        dest="${GITHUB_WORKSPACE}/../eyrie"
        if [ -d "$dest/.git" ]; then
          echo "eyrie already present at $dest"
          exit 0
        fi
        ref="${{ inputs.ref }}"
        # Fall back to main if the branch doesn't exist on eyrie
        if ! git ls-remote --heads "https://github.com/GrayCodeAI/eyrie.git" "$ref" | grep -q .; then
          echo "Branch '$ref' not found on eyrie, falling back to main"
          ref="main"
        fi
        git clone --depth=1 --branch "$ref" \
          "https://github.com/GrayCodeAI/eyrie.git" "$dest"
