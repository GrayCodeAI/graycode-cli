schema_version: 1

# Canonical repository inventory for the GrayCodeAI ecosystem. Repository
# directories and GitHub repository names are listed per repository;
# product_name records the user-facing capability. Tooling must consume this
# file instead of carrying its own repo-name list. Only repositories that
# exist are listed: removed siblings stay out until they are restored.
contracts:
  portable_graph_schema: graycode.graph/v1
  cloud_graph_schema: graycode-cloud.graph/v1
  usage_event: usage.recorded.v1

repositories:
  - directory: graycode-cli
    github_repo: graycode-cli
    product_name: Graycode
    kind: product
    language: go
    module: github.com/GrayCodeAI/graycode-cli
    workspace: true

  - directory: graycode-router
    github_repo: graycode-router
    product_name: Graycode Router
    kind: engine
    language: go
    module: github.com/GrayCodeAI/graycode-router
    workspace: true
    facade: github.com/GrayCodeAI/graycode-router/engine

  - directory: shrike
    github_repo: shrike
    product_name: Shrike (token/compress engine)
    kind: engine
    language: go
    module: github.com/GrayCodeAI/shrike
    workspace: true
    facade: github.com/GrayCodeAI/shrike

  - directory: harrier
    github_repo: harrier
    product_name: Harrier (memory-graph engine)
    kind: engine
    language: go
    module: github.com/GrayCodeAI/harrier
    workspace: true
    facade: github.com/GrayCodeAI/harrier/engine

  - directory: kestrel
    github_repo: kestrel
    product_name: Kestrel (code-review engine)
    kind: engine
    language: go
    module: github.com/GrayCodeAI/kestrel
    workspace: true
    facade: github.com/GrayCodeAI/kestrel

  - directory: merlin
    github_repo: merlin
    product_name: Merlin (site-audit engine)
    kind: engine
    language: go
    module: github.com/GrayCodeAI/merlin
    workspace: true
    facade: github.com/GrayCodeAI/merlin

  - directory: swift
    github_repo: swift
    product_name: Swift (session-correlation engine)
    kind: engine
    language: go
    module: github.com/GrayCodeAI/swift
    workspace: true
    facade: github.com/GrayCodeAI/swift/cli

  - directory: graycode-vscode
    github_repo: graycode-vscode
    product_name: Graycode VS Code extension
    kind: extension
    language: typescript
    workspace: false

  - directory: graycode-skills
    github_repo: graycode-skills
    product_name: Graycode Community Skills
    kind: extension
    language: python
    workspace: false

  - directory: graycode-platform
    github_repo: graycode-platform
    product_name: GrayCode Web and Cloud
    kind: platform
    language: typescript
    workspace: false
