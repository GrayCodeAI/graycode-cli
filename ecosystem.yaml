schema_version: 1

# Canonical repository inventory for the GrayCodeAI ecosystem. Repository
# directories and GitHub repository names use the bird codenames; product_name
# records the user-facing capability. Tooling must consume this file instead of
# carrying its own repo-name list.
contracts:
  eagle_version: v0.0.0-20260902153929-5877bed17503
  portable_graph_schema: graycode.graph/v1
  cloud_graph_schema: graycode-cloud.graph/v1
  usage_event: usage.recorded.v1

repositories:
  - directory: graycode-cli
    github_repo: graycode-cli
    product_name: Graycode
    kind: product
    language: go
    module: github.com/GrayCodeAI/graycode-cli
    workspace: true
    tracks_eagle: true

  - directory: eagle
    github_repo: eagle
    product_name: Eagle Contracts
    kind: foundation
    language: go
    module: github.com/GrayCodeAI/eagle
    workspace: true
    tracks_eagle: false

  - directory: falcon
    github_repo: falcon
    product_name: Falcon MCP Kit
    kind: foundation
    language: go
    module: github.com/GrayCodeAI/falcon
    workspace: true
