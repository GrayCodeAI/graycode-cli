schema_version: 1

# Canonical repository inventory for the GrayCodeAI ecosystem. Repository
# directories and GitHub repository names are listed per repository;
# product_name records the user-facing capability. Tooling must consume this
# file instead of carrying its own repo-name list. Only repositories that
# exist are listed: removed siblings stay out until they are restored.
contracts:
  portable_graph_schema: graycode.graph/v1
  cloud_graph_schema: graycode-cloud.graph/v1
  usage_event: usage.recorded.v1

repositories:
  - directory: graycode-cli
    github_repo: graycode-cli
    product_name: Graycode
    kind: product
    language: go
    module: github.com/GrayCodeAI/graycode-cli
    workspace: true

  - directory: graycode-router
    github_repo: graycode-router
    product_name: Eyrie
    kind: engine
    language: go
    module: github.com/GrayCodeAI/eyrie
    workspace: true
    facade: github.com/GrayCodeAI/eyrie/engine

  - directory: sparrow
    github_repo: sparrow
    product_name: Graycode SDK for Go
    kind: sdk
    language: go
    module: github.com/GrayCodeAI/sparrow
    workspace: false

  - directory: robin
    github_repo: robin
    product_name: Graycode SDK for Python
    kind: sdk
    language: python
    workspace: false

  - directory: wren
    github_repo: wren
    product_name: Graycode SDK for TypeScript
    kind: sdk
    language: typescript
    workspace: false

  - directory: starling
    github_repo: starling
    product_name: Graycode Community Skills
    kind: extension
    language: python
    workspace: false

  - directory: owl
    github_repo: owl
    product_name: Ecosystem Architecture Explorer
    kind: tooling
    language: javascript
    workspace: false

  - directory: graycode-platform
    github_repo: graycode-platform
    product_name: GrayCode Web and Cloud
    kind: platform
    language: typescript
    workspace: false
