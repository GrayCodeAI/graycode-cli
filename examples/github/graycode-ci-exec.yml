# Graycode CI agent (headless)
#
# Copy to .github/workflows/graycode-ci-exec.yml.
# Runs a non-interactive agent turn with JSON output — suitable for
# "fix failing tests", "summarize this PR", or similar CI jobs.
#
# Prerequisites:
#   - graycode binary on PATH (pin a release or install from your org's package)
#   - LLM credentials via secrets (never commit keys)
#   - Docker available on the runner if your graycode build requires container isolation
#
name: Graycode CI Exec

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Agent prompt"
        required: true
        default: "Summarize the git diff for this PR and list the riskiest files."

permissions:
  contents: read
  pull-requests: read

jobs:
  graycode-exec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install graycode with your org's preferred mechanism, for example:
      #   - curl -fsSL https://…/install.sh | sh
      #   - go install github.com/GrayCodeAI/graycode-cli/cmd/graycode@vX.Y.Z
      #   - download a release asset into $GITHUB_PATH
      - name: Ensure graycode is available
        run: |
          if ! command -v graycode >/dev/null 2>&1; then
            echo "Install graycode before this step (see comments in this workflow)."
            exit 1
          fi
          graycode version || graycode --version || true

      - name: Trust workspace (folder trust)
        run: graycode trust add --reason "github-actions ci" || true

      - name: Run agent (ephemeral + JSON)
        id: agent
        env:
          # Map your provider key(s) here, e.g. ANTHROPIC_API_KEY / OPENAI_API_KEY.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GRAYCODE_PROMPT: ${{ github.event.inputs.prompt || 'Summarize the changes in this PR (git log/diff) and list risks.' }}
        run: |
          set -euo pipefail
          PROMPT="${GRAYCODE_PROMPT}"
          graycode exec \
            --ephemeral \
            --json \
            --auto full \
            --max-turns 20 \
            "$PROMPT" | tee graycode-result.json

      - name: Upload agent result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graycode-result
          path: graycode-result.json
