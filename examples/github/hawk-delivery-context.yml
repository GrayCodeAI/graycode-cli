# Hawk Delivery Context
#
# Copy to .github/workflows/hawk-delivery-context.yml. This workflow assumes
# `hawk` is available on PATH (install it using your team's normal release
# mechanism before this reporting step).
#
# Create a dedicated, revocable Hawk Cloud device token for CI. Do not reuse a
# developer's local device token. Store all three values as repository secrets.
name: Hawk Delivery Context

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  report-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Install Hawk here using the release package your organization pins.
      # The remaining steps are intentionally independent of the installer.
      - name: Connect CI device to Hawk Cloud
        run: |
          hawk cloud connect \
            --endpoint "$HAWK_CLOUD_URL" \
            --device-id "$HAWK_CLOUD_DEVICE_ID" \
            --project-id "$HAWK_CLOUD_PROJECT_ID" \
            --token "$HAWK_CLOUD_DEVICE_TOKEN"
        env:
          HAWK_CLOUD_URL: ${{ secrets.HAWK_CLOUD_URL }}
          HAWK_CLOUD_DEVICE_ID: ${{ secrets.HAWK_CLOUD_DEVICE_ID }}
          HAWK_CLOUD_PROJECT_ID: ${{ secrets.HAWK_CLOUD_PROJECT_ID }}
          HAWK_CLOUD_DEVICE_TOKEN: ${{ secrets.HAWK_CLOUD_DEVICE_TOKEN }}

      - name: Report successful CI run
        if: ${{ success() }}
        run: hawk cloud context --ci-status succeeded

      - name: Report failed CI run
        if: ${{ failure() }}
        run: hawk cloud context --ci-status failed
