# Hawk Issue Resolver
#
# Copy this file to .github/workflows/hawk-issue-resolver.yml in your repository.
#
# It runs the Hawk agent in two scenarios:
#   1. Automation mode  - when an issue is labeled `hawk-agent`, Hawk reads the
#      issue title + body and attempts to resolve it autonomously.
#   2. Interactive mode - when someone comments "@hawk ..." on an issue or PR,
#      Hawk replies conversationally to the request.
#
# The mode is auto-detected by `hawk exec` from the GitHub event payload, so a
# single composite action handles both paths.
name: Hawk Issue Resolver

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  hawk:
    # Run on the `hawk-agent` label, or on any comment mentioning @hawk.
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'hawk-agent') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@hawk')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@hawk'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Hawk
        id: hawk
        uses: GrayCodeAI/hawk/.github/actions/hawk@main
        with:
          # Leave prompt empty so Hawk derives it from the triggering event.
          # Set a "/skill-name args" prompt here to dispatch a skill instead.
          prompt: ""
          auto: semi
          output-format: text
        env:
          # Provide your model provider credentials as repository secrets.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Post Hawk response as a comment
        if: ${{ steps.hawk.outputs.response != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = `🦅 **Hawk**\n\n${{ toJSON(steps.hawk.outputs.response) }}`;
            const issueNumber = context.issue.number;
            if (issueNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
