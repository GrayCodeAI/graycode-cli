# Graycode Issue Resolver
#
# Copy this file to .github/workflows/graycode-issue-resolver.yml in your repository.
#
# It runs the Graycode agent in two scenarios:
#   1. Automation mode  - when an issue is labeled `graycode-agent`, Graycode reads the
#      issue title + body and attempts to resolve it autonomously.
#   2. Interactive mode - when someone comments "@graycode ..." on an issue or PR,
#      Graycode replies conversationally to the request.
#
# The mode is auto-detected by `graycode exec` from the GitHub event payload, so a
# single composite action handles both paths.
name: Graycode Issue Resolver

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  graycode:
    # Run on the `graycode-agent` label, or on any comment mentioning @graycode.
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'graycode-agent') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@graycode')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@graycode'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Graycode
        id: graycode
        uses: GrayCodeAI/graycode-cli/.github/actions/graycode@main
        with:
          # Leave prompt empty so Graycode derives it from the triggering event.
          # Set a "/skill-name args" prompt here to dispatch a skill instead.
          prompt: ""
          auto: semi
          output-format: text
        env:
          # Provide your model provider credentials as repository secrets.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Post Graycode response as a comment
        if: ${{ steps.graycode.outputs.response != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = `🦅 **Graycode**\n\n${{ toJSON(steps.graycode.outputs.response) }}`;
            const issueNumber = context.issue.number;
            if (issueNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
