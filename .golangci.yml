version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - noctx
    - bodyclose
    - unconvert
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      enable-all: true
      disable:
        - fieldalignment
    staticcheck:
      checks:
        - all
        - -SA1019
  exclusions:
    paths:
      - .gomodcache
      - vendor
    rules:
      - path: _test\.go
        linters:
          - noctx
          - bodyclose
          - errcheck
          - unused
      - path: cmd/
        linters:
          - noctx
          - errcheck
      - path: daemon/
        linters:
          - errcheck
      - path: engine/
        linters:
          - errcheck
      - path: sandbox/
        linters:
          - errcheck
      - path: memory/
        linters:
          - errcheck
      - path: tool/
        linters:
          - errcheck
      - path: repomap/
        linters:
          - errcheck
      - path: mcp/
        linters:
          - errcheck
      - path: magicdocs/
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
